services:
  - type: web
    name: psx-rsi-dashboard
    runtime: node
    plan: free
    # NOTE: PSX's feed (dps.psx.com.pk) blocks Render's Singapore IP range
    # (connections reset with UND_ERR_SOCKET). Frankfurt works. Do not switch
    # this back to singapore even though it's geographically closest to PSX.
    region: frankfurt
    branch: main
    buildCommand: npm install && npm run build
    startCommand: npm run start
    autoDeploy: true
    healthCheckPath: /
    envVars:
      - key: NODE_VERSION
        value: 22.22.2
